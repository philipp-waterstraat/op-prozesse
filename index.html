document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  
  window.addEventListener('error', function(e) {
    
    
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    
    
    
    
    
    
    
    
    
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; 
      
      
      
      
      
      
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    
    
    
    
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; 
    const pendingRelays = {}; 
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) {  }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) {  }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      
      
      
      
      
      
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) {  }
          return;
        }
        if (isPageRoot || window.parent === window) return; 
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        
        
        
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        
        
        
        
        
        
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    
    
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    
    
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    
    
    
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    
    
    
    
    
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    
    
    
    
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    
    
    
    
    
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      
      
      
      
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    
    
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

eme }}\" style=\"height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:14px;overflow:hidden\">\n\n  <div style=\"height:2px;flex:none;background:linear-gradient(90deg,transparent,var(--acc) 30%,var(--acc) 70%,transparent);opacity:.6\"><\u002Fdiv>\n  <header style=\"flex:none;display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding:11px 20px;border-bottom:1px solid var(--line-soft);background:var(--panel-glass)\">\n    <div style=\"display:flex;align-items:center;gap:10px;min-width:0;flex:none\">\n      <div style=\"width:8px;height:8px;flex:none;border-radius:2px;background:var(--acc);box-shadow:0 0 10px var(--acc);animation:ledpulse 2.4s infinite\"><\u002Fdiv>\n      <span style=\"font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:15px;letter-spacing:.04em;white-space:nowrap\">OP<span style=\"color:var(--acc-ink)\">·<\u002Fspan>PROZESSZEITEN<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1;max-width:430px;margin:0 auto;position:relative\">\n      <div class=\"swp\" style=\"display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--acc-soft);padding:7px 13px;border-radius:9px\">\n        <span style=\"color:var(--acc-ink);font-family:'JetBrains Mono',monospace;font-size:12px;flex:none\">&gt;_<\u002Fspan>\n        <input ref=\"{{ cmdRef }}\" value=\"{{ cmd }}\" sc-camel-on-change=\"{{ onCmd }}\" sc-camel-on-key-down=\"{{ onCmdKey }}\" placeholder=\"Code oder Begriff — z. B. K17a\" style=\"flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:12.5px\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--faint);letter-spacing:.12em;flex:none\">⌘K<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ cmdOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;left:0;right:0;top:calc(100% none;border:1px solid var(--line-soft);border-radius:8px;padding:0;cursor:pointer\" title=\"Hell- oder Dunkelmodus\">◐<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 20px;border-bottom:1px solid var(--rule);background:var(--bg)\">\n    <span sc-camel-on-click=\"{{ onFilter }}\" style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;color:var(--faint);cursor:pointer\">EINLEITUNG: <span style=\"color:var(--acc-ink)\">{{ einLabel }}<\u002Fspan><\u002Fspan>\n    <span sc-camel-on-click=\"{{ onFilter }}\" style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;color:var(--faint);cursor:pointer\">AUSLEITUNG: <span style=\"color:var(--acc-ink)\">{{ ausLabel }}<\u002Fspan><\u002Fspan>\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;color:var(--c-a)\">● {{ aktivLabel }} KENNZAHLEN AKTIV<\u002Fspan>\n    <sc-if value=\"{{ selChip }}\" hint-placeholder-val=\"{{ false }}\">\n      <span sc-camel-on-click=\"{{ clearSel }}\" style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;color:var(--c-o);border:1px solid var(--c-o);border-radius:99px;padding:3px 11px;cursor:pointer\">FOKUS: {{ selChip }} ✕<\u002Fspan>\n    <\u002Fsc-if>\n    <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.12em;color:var(--faint)\">▶ DE · ‡ AT · * CH — ROUTINEEMPFEHLUNG<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"flex:1;display:flex;min-height:0;position:relative\">\n\n    <sc-if value=\"{{ tabChart }}\" hint-placeholder-val=\"{{ true }}\">\n      <div sc-camel-on-mouse-leave=\"{{ tipHide }}\" style=\"flex:1;overflow:auto;min-width:0\">{{ chart }}\n    <div style=\"position:sticky;left:0;max-width:1180px;padding:0 26px 30px;margin-top:34px\">\n      <div style=\"height:1px;background:linear-gradient(90deg,var(--acc),transparent 62%);opacity:.45;margin-bottom:20px\"><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(190px,1fr) minmax(300px,2.1fr) auto;gap:26px 40px;align-items:start\">\n\n        <div>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.2em;color:var(--acc-ink);margin-bottom:7px\">DARSTELLUNG<\u002Fdiv>\n          <p style=\"font-size:10.5px;line-height:1.6;color:var(--faint);margin:0\">Perioperative Prozesszeiten und Kennzahlen, dargestellt entlang des tatsächlichen OP-Prozesses. Nicht im Glossar konsentierte Intervalle sind als solche gekennzeichnet.<\u002Fp>\n          <p style=\"font-size:10.5px;line-height:1.6;color:var(--faint);margin:0;margin-top:9px\">Philipp Waterstraat, MSc — erstellt unter Verwendung von Claude, einem KI-Assistenten der Anthropic PBC. Fachliche Auswahl, Prüfung und Verantwortung liegen beim Autor.<\u002Fp>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.2em;color:var(--acc-ink);margin-bottom:7px\">QUELLEN<\u002Fdiv>\n          <p style=\"font-size:10.5px;line-height:1.6;color:var(--faint);margin:0\">Bauer M, Auhuber TC, Kraus R, Rüggeberg J, Wardemann K, Müller P, Taube C, Diemer M, Schuster M: Glossar perioperativer Prozesszeiten und Kennzahlen. Eine gemeinsame Empfehlung von BDA, BDC, VOPM, VOPMÖ und SFOPM. Version 2020. <em style=\"color:var(--dim)\">Anästh Intensivmed<\u002Fem> 2020;61:516–531.<br><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--dim)\">DOI 10.19224/ai2020.516<\u002Fspan><\u002Fp>\n          <p style=\"font-size:10.5px;line-height:1.6;color:var(--faint);margin:0;margin-top:9px\">Bauer M, Schuster M: Prozesszeiten und Kennzahlen im OP-Management. <em style=\"color:var(--dim)\">OP-Management up2date<\u002Fem> 2021;1:63–82.<br><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--dim)\">DOI 10.1055/a-1335-7759<\u002Fspan><\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:7px;min-width:150px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.2em;color:var(--acc-ink);margin-bottom:7px\">RECHTLICHES<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ onImp }}\" style=\"background:none;border:1px solid var(--line-soft);border-radius:7px;padding:5px 11px;font-family:'Chakra Petch',sans-serif;font-size:11px;color:var(--dim);cursor:pointer;text-align:left\">Impressum<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onDsg }}\" style=\"background:none;border:1px solid var(--line-soft);border-radius:7px;padding:5px 11px;font-family:'Chakra Petch',sans-serif;font-size:11px;color:var(--dim);cursor:pointer;text-align:left\">Datenschutzerklärung<\u002Fbutton>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ tabKap }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;overflow:auto;padding:26px 32px\">\n        <div style=\"font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:19px;margin-bottom:6px\">Kapazität und Auslastung<\u002Fdiv>\n        <p style=\"max-width:760px;color:var(--dim);font-size:13px;line-height:1.6;margin:0 0 22px\">Diese Kennzahlen beziehen sich nicht auf den einzelnen Fall, sondern auf Saal, Fachabteilung und Beobachtungszeitraum. Sie haben deshalb keine Position auf der Fallzeitachse. Die Saalbetriebszeit ist ein Planwert: S1 liegt 15 Minuten vor der ersten Soll-Schnittzeit, S2 zwanzig Minuten nach der letzten Soll-Nahtzeit.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:64px 250px 250px 54px 130px 1fr;gap:0 18px;max-width:1180px;padding:8px 14px;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.16em;color:var(--faint)\">\n          <span>CODE<\u002Fspan><span>BEZEICHNUNG<\u002Fspan><span>BERECHNUNG<\u002Fspan><span>EMPF.<\u002Fspan><span>BEZUG<\u002Fspan><span> m;color:var(--dim);background:none;border:1px solid var(--line-soft);border-radius:99px;padding:5px 11px;cursor:pointer\">nur Routineempfehlung DE<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-for list=\"{{ kzRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n            <sc-if value=\"{{ r.hdr }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.16em;color:var(--faint);margin:12px 0 4px;text-transform:uppercase\">{{ r.label }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ r.item }}\" hint-placeholder-val=\"{{ true }}\">\n              <label style=\"display:flex;align-items:flex-start;gap:8px;padding:2.5px 0;font-size:12.5px;cursor:pointer;opacity:{{ r.op }}\">\n                <input type=\"checkbox\" checked=\"{{ r.checked }}\" sc-camel-on-change=\"{{ r.toggle }}\" style=\"margin:3px 0 0;accent-color:var(--acc)\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:{{ r.color }};min-width:38px;padding-top:1px\">{{ r.code }}<\u002Fspan>\n                <span>{{ r.name }}<\u002Fspan>\n              <\u002Flabel>\n            <\u002Fsc-if>\n          <\u002Fsc-for>\n\n          <div style=\"height:1px;background:var(--rule);margin:20px 0\"><\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.2em;color:var(--acc-ink);margin-bottom:10px\">ZEITPUNKTE<\u002Fdiv>\n          <div style=\"display:flex;gap:6px\">\n            <button sc-camel-on-click=\"{{ onTpAlle }}\" style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--dim);background:none;border:1px solid var(--line-soft);border-radius:99px;padding:5px 11px;cursor:pointer\">alle<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ onTpDach }}\" style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--dim);background:none;border:1px solid var(--line-soft);border-radius:99px;padding:5px 11px;cursor:pointer\">nur Routineempfehlung DE<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"height:1px;background:var(--rule);margin:20px 0\"><\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.2em;color:var(--acc-ink);margin-bottom:10px\">HAUSKONFIGURATION<\u002Fdiv>\n          <label style=\"display:block;font-size:11px;color:var(--faint);margin:8px 0 4px\">Einschleusen (P3 / P4) verantwortet<\u002Flabel>\n          <sc-raw-select value=\"{{ schleuse }}\" sc-camel-on-change=\"{{ onSchleuse }}\" style=\"width:100%;font-family:'Hanken Grotesk',sans-serif;font-size:12.5px;padding:7px 9px;border:1px solid var(--line-soft);border-radius:8px;background:var(--panel);color:var(--ink);outline:none\">\n            <option value=\"OP-FD\">OP-Funktionsdienst<\u002Foption><option value=\"AN-FD\">Anästhesie-Funktionsdienst<\u002Foption><option value=\"LOG\">Eigenes Schleusenpersonal<\u002Foption>\n          <\u002Fsc-raw-select>\n          <label style=\"display:block;font-size:11px;color:var(--faint);margin:10px 0 4px\">Anmeldung nachsorgende Einheit (P6)<\u002Flabel>\n          <sc-raw-select value=\"{{ anmeldung }}\" sc-camel-on-change=\"{{ onAnmeldung }}\" style=\"width:100%;font-family:'Hanken Grotesk',sans-serif;font-size:12.5px;padding:7px 9px;border:1px solid var(--line-soft);border-radius:8px;background:var(--panel);color:var(--ink);outline:none\">\n            <option value=\"AN-A\">Anästhesie-Arzt<\u002Foption><option value=\"AN-FD\">Anästhesie-Funktionsdienst<\u002Foption><option value=\"ADM\">OP-Koordination<\u002Foption>\n          <\u002Fsc-raw-select>\n          <p style=\"font-size:11px;color:var(--faint);line-height:1.5;margin:10px 0 0\">Beides ist hausindividuell geregelt. Die Einstellung steht in der Adresszeile und lässt sich als Lesezeichen oder Link weitergeben.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div ref=\"{{ tipRef }}\" style=\"position:fixed;pointer-events:none;z-index:80;max-width:310px;opacity:0;transition:opacity .1s;background:var(--panel-glass);border:1px solid var(--line);border-radius:10px;padding:9px 12px;box-shadow:0 12px 36px rgba(0,0,0,.5)\">\n    <div style=\"font-size:12px;font-weight:700;margin-bottom:2px;font-family:'Chakra Petch',sans-serif\">{{ tipTitle }}<\u002Fdiv>\n    <div style=\"font-size:11.5px;line-height:1.5;color:var(--dim)\">{{ tipBody }}<\u002Fdiv>\n    <sc-if value=\"{{ tipFormel }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--acc-ink);margin-top:4px\">{{ tipFormel }}<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  \n  <sc-if value=\"{{ rechtImp }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto\">\n      <div style=\"max-width:760px;margin:0 auto;padding:34px 28px 70px\">\n        <button sc-camel-on-click=\"{{ onRechtZu }}\" style=\"float:right;background:none;border:1px solid var(--line-soft);border-radius:8px;color:var(--dim);font:inherit;font-size:12px;padding:6px 12px;cursor:pointer\">Schließen<\u002Fbutton>\n        <div style=\"font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:22px;letter-spacing:.02em\">Impressum<\u002Fdiv>\n\n        <div style=\"font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:15px;margin:22px 0 7px\">Angaben gemäß § 5 DDG<\u002Fdiv>\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim)\">Philipp Waterstraat, MSc<br>\n        <span style=\"color:var(--acc-ink);background:var(--acc-soft);padding:0 5px;border-radius:3px\">[ladungsfähige Anschrift — erst bei geschäftsmäßiger Nutzung erforderlich]<\u002Fspan><\u002Fp>\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim);font-size:11.5px\">Dieses Angebot wird derzeit privat und ohne Gewinnerzielungsabsicht bereitgestellt. Eine Impressumspflicht nach § 5 DDG besteht nach Einschätzung des Autors nicht; diese Angaben erfolgen freiwillig.<\u002Fp>\n\n        <div style=\"font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:15px;margin:22px 0 7px\">Kontakt<\u002Fdiv>\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim)\">E-Mail: ph.waterstraat@gmail.com<\u002Fp>\n\n        <div style=\"font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:15px;margin:22px 0 7px\">Verantwortlich für den Inhalt<\u002Fdiv>\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim)\">Philipp Waterstraat, MSc, Anschrift wie oben.<\u002Fp>\n\n        <div style=\"font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:15px;margin:22px 0 7px\">Art des Angebots<\u002Fdiv>\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim)\">Dieses Angebot ist ein nicht kommerzielles Fachprojekt ohne Gewinnerzielungsabsicht. Es werden keine Waren oder Dienstleistungen angeboten und keine Verträge geschlossen.<\u002Fp>\n\n        <div style=\"font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:15px;margin:22px 0 7px\">Verbraucherstreitbeilegung<\u002Fdiv>\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim)\">Zur Teilnahme an einem Streitbeilegungsverfahren vor einer Verbraucherschlichtungsstelle bin ich weder bereit noch verpflichtet.<\u002Fp>\n\n        <div style=\"font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:15px;margin:22px 0 7px\">Haftung für Inhalte und Links<\u002Fdiv>\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim)\">Die Inhalte wurden mit Sorgfalt erstellt, eine Gewähr für Richtigkeit, Vollständigkeit und Aktualität wird nicht übernommen. Die Darstellung ersetzt weder das zugrunde liegende Fachglossar noch eine fachliche oder rechtliche Beratung. Für Inhalte verlinkter externer Seiten ist deren jeweiliger Anbieter verantwortlich; zum Zeitpunkt der Verlinkung waren keine Rechtsverstöße erkennbar.<\u002Fp>\n\n        <div style=\"font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:15px;margin:22px 0 7px\">Urheberrecht und Quellen<\u002Fdiv>\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim)\">Ein Großteil der dargestellten Zeitpunkte und Kennzahlen beruht auf dem Glossar perioperativer Prozesszeiten und Kennzahlen (Version 2020), das in der Fußzeile vollständig zitiert ist. Bezeichnungen und Codes sind Fachterminologie; die Erläuterungstexte sind eigene Formulierungen und keine wörtliche Wiedergabe. Ergänzend dargestellte Intervalle sind im Glossar nicht konsentiert und in der Anwendung entsprechend gekennzeichnet.<\u002Fp>\n\n        <div style=\"font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:15px;margin:22px 0 7px\">Hinweis zum Einsatz künstlicher Intelligenz<\u002Fdiv>\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim)\">Konzeption, Datenmodell, Texte und Programmcode dieser Anwendung sind unter Verwendung von Claude entstanden, einem KI-Assistenten der Anthropic PBC. Die fachliche Auswahl, Prüfung und Verantwortung für alle Inhalte liegt beim Autor. Der Hinweis erfolgt freiwillig zur Transparenz; eine Kennzeichnungspflicht nach Artikel 50 der Verordnung (EU) 2024/1689 besteht für diese Art von Inhalt nach Einschätzung des Autors nicht.<\u002Fp>\n\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim);margin-top:26px\">Stand: 31. August 2026<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ rechtDsg }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto\">\n      <div style=\"max-width:760px;margin:0 auto;padding:34px 28px 70px\">\n        <button sc-camel-on-click=\"{{ onRechtZu }}\" style=\"float:right;background:none;border:1px solid var(--line-soft);border-radius:8px;color:var(--dim);font:inherit;font-size:12px;padding:6px 12px;cursor:pointer\">Schließen<\u002Fbutton>\n        <div style=\"font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:22px;letter-spacing:.02em\">Datenschutzerklärung<\u002Fdiv>\n\n        <div style=\"font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:15px;margin:22px 0 7px\">1. Verantwortlicher<\u002Fdiv>\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim)\">Verantwortlicher im Sinne der Datenschutz-Grundverordnung ist:<br>\n        Philipp Waterstraat, MSc<br>E-Mail: ph.waterstraat@gmail.com<\u002Fp>\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim)\">Ein Datenschutzbeauftragter ist nicht bestellt, da die Voraussetzungen des Artikels 37 DSGVO und des § 38 BDSG nicht vorliegen.<\u002Fp>\n\n        <div style=\"font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:15px;margin:22px 0 7px\">2. Umfang der Verarbeitung<\u002Fdiv>\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim)\">Diese Anwendung besteht aus einer einzelnen HTML-Datei. Sie setzt keine Cookies, bindet keine externen Ressourcen ein und führt keine Analyse, kein Tracking und keine Reichweitenmessung durch. Schriftarten sind in der Datei eingebettet und werden nicht von fremden Servern nachgeladen. Es gibt keine Kontaktformulare, keine Registrierung und keine Nutzerkonten.<\u002Fp>\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim)\">Einstellungen, die Sie in der Anwendung vornehmen, werden im Adressfragment hinter dem Rautezeichen abgelegt. Dieses Fragment wird von Ihrem Browser technisch bedingt nicht an den Server übertragen und verbleibt ausschließlich auf Ihrem Gerät.<\u002Fp>\n\n        <div style=\"font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:15px;margin:22px 0 7px\">3. Hosting und Server-Logdateien<\u002Fdiv>\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim)\">Diese Seite wird über GitHub Pages bereitgestellt, einen Dienst der GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA. Beim Aufruf der Seite verarbeitet GitHub technisch notwendige Zugriffsdaten, insbesondere Ihre IP-Adresse, Datum und Uhrzeit des Zugriffs, die aufgerufene Adresse, den übermittelnden Verweis sowie Angaben zu Browser und Betriebssystem.<\u002Fp>\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim)\">Rechtsgrundlage ist Artikel 6 Absatz 1 Buchstabe f DSGVO. Das berechtigte Interesse liegt in der sicheren, stabilen und effizienten Bereitstellung des Angebots. Auf Dauer und Umfang der Speicherung durch GitHub hat der Verantwortliche keinen Einfluss; nähere Angaben enthält die Datenschutzerklärung von GitHub unter docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement.<\u002Fp>\n\n        <div style=\"font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:15px;margin:22px 0 7px\">4. Übermittlung in die Vereinigten Staaten<\u002Fdiv>\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim)\">Mit der Nutzung von GitHub Pages werden personenbezogene Daten in die Vereinigten Staaten übermittelt. Die Europäische Kommission hat mit Beschluss vom 10. Juli 2023 für nach dem EU-US Data Privacy Framework zertifizierte Unternehmen ein angemessenes Schutzniveau festgestellt. Der aktuelle Zertifizierungsstatus des Anbieters ist über die offizielle Liste des Data Privacy Framework abrufbar. Soweit eine Zertifizierung nicht besteht, stützt sich die Übermittlung auf die Standardvertragsklauseln nach Artikel 46 Absatz 2 Buchstabe c DSGVO.<\u002Fp>\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim)\">Es kann nicht vollständig ausgeschlossen werden, dass Behörden in den Vereinigten Staaten auf übermittelte Daten zugreifen und dass gegen einen solchen Zugriff kein mit dem Unionsrecht vergleichbarer Rechtsschutz besteht.<\u002Fp>\n\n        <div style=\"font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:15px;margin:22px 0 7px\">5. Speicherdauer<\u002Fdiv>\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim)\">Der Verantwortliche selbst speichert keine personenbezogenen Daten. Die Speicherdauer der Logdateien richtet sich nach den Vorgaben von GitHub.<\u002Fp>\n\n        <div style=\"font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:15px;margin:22px 0 7px\">6. Ihre Rechte<\u002Fdiv>\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim)\">Sie haben das Recht auf Auskunft (Artikel 15), Berichtigung (Artikel 16), Löschung (Artikel 17), Einschränkung der Verarbeitung (Artikel 18), Datenübertragbarkeit (Artikel 20) sowie das Recht, der Verarbeitung aus Gründen, die sich aus Ihrer besonderen Situation ergeben, jederzeit zu widersprechen (Artikel 21 DSGVO). Wenden Sie sich dazu an die oben genannte Adresse.<\u002Fp>\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim)\">Unabhängig davon steht Ihnen nach Artikel 77 DSGVO ein Beschwerderecht bei einer Datenschutzaufsichtsbehörde zu. Zuständig ist unter anderem die Aufsichtsbehörde Ihres gewöhnlichen Aufenthaltsorts sowie für den Verantwortlichen: Der Hessische Beauftragte für Datenschutz und Informationsfreiheit, Postfach 31 63, 65021 Wiesbaden, poststelle@datenschutz.hessen.de.<\u002Fp>\n\n        <div style=\"font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:15px;margin:22px 0 7px\">7. Keine automatisierte Entscheidungsfindung<\u002Fdiv>\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim)\">Eine automatisierte Entscheidungsfindung einschließlich Profiling nach Artikel 22 DSGVO findet nicht statt.<\u002Fp>\n\n        <p style=\"margin:0 0 9px;font-size:13px;line-height:1.65;color:var(--dim);margin-top:26px\">Stand: 31. August 2026<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  \n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;1600px&quot;,&quot;height&quot;:&quot;900px&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    theme:\"light\", tab:\"chart\", vEin:\"raum\", vAus:\"saal\", schleuse:\"OP-FD\", anmeldung:\"AN-A\",\n    labels:true, tpLabels:true, hov:null, hovTp:null, recht:null, dicht:false, praes:false, filterOpen:false,\n    sel:null, selTp:null, suche:\"\", cmd:\"\", grpSel:[],\n    mBasis:\"gebunden\", mModus:\"beteiligt\", mLogik:\"oder\",\n    kzAn:null, tpAn:null, tip:null, ready:false\n  };\n  componentDidMount(){\n    import((window.__resources&&window.__resources.glossarDaten)||'./glossar-daten.js').then(M=>{\n      this.M=M;\n      const st={kzAn:new Set(M.KZ.map(k=>k.c)), tpAn:new Set(Object.keys(M.TP)), ready:true};\n      if(location.hash){\n        const p=new URLSearchParams(location.hash.slice(1));\n        if(p.get(\"ein\")) st.vEin=p.get(\"ein\");\n        if(p.get(\"aus\")) st.vAus=p.get(\"aus\");\n        if(p.get(\"schl\")) st.schleuse=p.get(\"schl\");\n        if(p.get(\"anm\")) st.anmeldung=p.get(\"anm\");\n        if(p.get(\"theme\")) st.theme=p.get(\"theme\");\n      }\n      this.setState(st);\n    });\n    this._key=e=>{\n      if(e.key===\"Escape\") this.setState({sel:null,selTp:null,filterOpen:false,recht:null,cmd:\"\"});\n      if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()===\"k\"){e.preventDefault();if(this.cmdEl)this.cmdEl.focus();}\n    };\n    window.addEventListener(\"keydown\",this._key);\n  }\n  componentWillUnmount(){window.removeEventListener(\"keydown\",this._key)}\n  hash(){\n    const s=this.state;\n    const p=new URLSearchParams({ein:s.vEin,aus:s.vAus,schl:s.schleuse,anm:s.anmeldung,theme:s.theme});\n    history.replaceState(null,\"\",\"#\"+p.toString());\n  }\n  setCfg(patc
